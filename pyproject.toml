[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bifrost-cli"
version = "0.0.3"
authors = [
    { name = "Sankalpa Adhikari", email = "sankalpa2522@gmail.com" },
]
description = "Command line tool that helps you to create, update, deploy, redeploy, delete forms in Kobo-toolbox."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer",
    "keyring",
    "pandas",
    "requests",
    "openpyxl",
    "xlsxwriter",
    "secretstorage",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy",
    "flake8",
    "black",
    "tox",
    "types-requests",
    "pandas-stubs",
]

[project.urls]
Repository = "https://github.com/sankalpa-adhikari-sa/Kobo-bifrost-cli"

[project.scripts]
bifrost = "bifrost_cli.bifrost:app"

[tool.hatch.build.targets.wheel]
packages = ["bifrost_cli"]
include = [
    "bifrost_cli/**/*.py",
]
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.py$'
