[tox]
env_list = py38, py39, py310, py311, py312, py313, lint, type, black
isolated_build = True
requires =
    tox>=4.2
    hatchling>=1.21.0

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313, lint, type, black

[testenv]
skip_install = false
deps =
    pytest>=7.0
    mypy
    flake8
    black
    types-requests
    pandas-stubs
commands =
    pytest {posargs:tests}
    mypy bifrost_cli
    {env:SKIP_FLAKE8:flake8 bifrost_cli}
    {env:SKIP_BLACK:black --check bifrost_cli}
passenv =
    HOME
    USERPROFILE
    CI
    GITHUB_*
allowlist_externals =
    true
    false

[testenv:lint]
description = run linters
skip_install = true
deps =
    flake8
    black
    isort
commands =
    black --check bifrost_cli
    flake8 bifrost_cli
    isort --check-only bifrost_cli

[testenv:type]
description = run type checks
skip_install = true
deps =
    mypy
    types-requests
    pandas-stubs
commands =
    mypy bifrost_cli

[testenv:black]
description = run black formatter
skip_install = true
deps = black
commands = black bifrost_cli

[testenv:format]
description = run formatters
skip_install = true
deps =
    black
    isort
commands =
    black bifrost_cli
    isort bifrost_cli
[flake8]
max-line-length = 130
extend-ignore = E203, W503
exclude =
    .tox,
    .git,
    __pycache__,
    build,
    dist,
    *.pyc,
    *.egg-info,
    .eggs

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88
